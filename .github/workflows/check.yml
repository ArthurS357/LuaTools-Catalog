name: check

# Guards the override file: a bad orphaned_fixes.json would otherwise only surface at the next 6-hourly
# sync, and because the sync is fail-closed it would then keep failing until someone fixed it.
# Offline: no download, no secrets.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - catalog.json

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Validate orphaned_fixes.json against the current catalog
        run: python scripts/sync_catalog.py --check

name: sync-catalog

# Every 6 hours: download the public lua.tools listing, merge orphaned_fixes.json, commit catalog.json.
# No secrets are used: the only credential is the job's own GITHUB_TOKEN, to push the commit.
# Fail-closed: if the tests, the download, the parse or the schema check fail, the job stops red
# BEFORE the commit step and catalog.json in the repository stays as it was.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Sync catalog.json
        run: python scripts/sync_catalog.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- catalog.json)" ]; then
            echo "catalog.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore(catalog): sync from lua.tools"
          git push
